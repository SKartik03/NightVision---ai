services:
  - type: web
    name: nightvision-ai
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MODEL_MODE
        value: DEMO
    plan: free
    autoDeploy: true
